services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: valthera
      POSTGRES_USER: valthera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valthera -d valthera"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  api:
    build: .
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://valthera:${POSTGRES_PASSWORD}@postgres:5432/valthera?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: